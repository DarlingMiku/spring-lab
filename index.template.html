<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tune spring physics, preview motion, and export a CSS easing curve.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>Spring Lab</title>
  <style>/* APP_STYLES */</style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><h1>Spring Lab</h1><p>Tune a spring and take its motion into CSS.</p></div>
      </div>
      <button id="download" type="button">Download CSS</button>
    </header>
    <div class="workspace">
      <div class="main">
        <section class="panel stage" aria-labelledby="preview-heading">
          <div class="panel-top stage-top">
            <h2 id="preview-heading">Motion preview</h2>
            <div id="modes" class="choices" role="group" aria-label="Preview mode">
              <button type="button" data-mode="slide" aria-pressed="true">Slide</button>
              <button type="button" data-mode="pop" aria-pressed="false">Pop</button>
              <button type="button" data-mode="turn" aria-pressed="false">Turn</button>
            </div>
          </div>
          <div class="lanes" aria-label="Comparison of spring and cubic ease-out">
            <div class="lane">
              <p><i class="spring-dot"></i>Spring</p>
              <div class="track"><span class="target" aria-hidden="true"></span><span class="tile" id="spring-tile" aria-hidden="true"></span></div>
            </div>
            <div class="lane">
              <p><i class="ease-dot"></i>Cubic ease-out</p>
              <div class="track"><span class="target" aria-hidden="true"></span><span class="tile reference" id="reference-tile" aria-hidden="true"></span></div>
            </div>
          </div>
          <div class="transport">
            <button id="play" class="primary" type="button">Play</button>
            <button id="restart" type="button">Reset</button>
            <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub animation">
            <output id="clock" for="scrub"></output>
          </div>
        </section>
        <section class="panel graph-panel" aria-labelledby="graph-heading">
          <div class="panel-top"><h2 id="graph-heading">Progress over time</h2><span id="progress"></span></div>
          <canvas id="curve" role="img" aria-label="Chart comparing the spring easing curve with cubic ease-out"></canvas>
        </section>
      </div>
      <aside>
        <section class="panel controls" aria-labelledby="controls-heading">
          <div class="panel-top"><h2 id="controls-heading">Spring settings</h2></div>
          <div class="control-body">
            <div id="presets" class="choices presets" role="group" aria-label="Spring presets">
              <button data-preset="snappy" type="button" aria-pressed="false">Snappy</button>
              <button data-preset="bounce" type="button" aria-pressed="false">Bouncy</button>
              <button data-preset="soft" type="button" aria-pressed="false">Soft</button>
            </div>
            <label class="parameter" for="stiffness">
              <span>Stiffness</span><output id="stiffness-value" for="stiffness"></output>
              <input id="stiffness" type="range" min="80" max="600" step="1">
            </label>
            <label class="parameter" for="damping">
              <span>Damping</span><output id="damping-value" for="damping"></output>
              <input id="damping" type="range" min="6" max="60" step="1">
            </label>
            <label class="parameter" for="mass">
              <span>Mass</span><output id="mass-value" for="mass"></output>
              <input id="mass" type="range" min="0.6" max="2.2" step="0.1">
            </label>
            <dl class="metrics">
              <div><dt>Settling time</dt><dd id="duration"></dd></div>
              <div><dt>Overshoot</dt><dd id="overshoot"></dd></div>
              <div class="wide"><dt>Damping regime</dt><dd id="regime"></dd></div>
            </dl>
          </div>
        </section>
        <section class="panel export" aria-labelledby="export-heading">
          <div class="panel-top"><h2 id="export-heading">CSS export</h2><button id="copy" type="button">Copy CSS</button></div>
          <textarea id="css" readonly spellcheck="false" aria-label="Generated CSS"></textarea>
          <p id="notice" role="status" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </main>
  <script>/* APP_SCRIPT */</script>
</body>
</html>
