<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tune spring physics, preview motion, and export a CSS easing curve.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>Spring Lab</title>
  <style>:root {
  color-scheme: dark;
  font: 14px/1.5 system-ui, sans-serif;
  color: #f1edf7;
  background: #100f17;
  --surface: #181621;
  --raised: #211e2d;
  --border: #3b354b;
  --text: #bcb4ca;
  --spring: #ffb199;
  --ease: #bcb0f7;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; }
p, h1, h2, dl, dd { margin: 0; }
h1 { font-size: clamp(27px, 4vw, 40px); line-height: 1.1; letter-spacing: -.054em; }
h2 { font-size: 14px; font-weight: 670; }
button, input, textarea { font: inherit; }
button {
  min-height: 33px; padding: 5px 10px; white-space: nowrap; cursor: pointer;
  color: inherit; border: 1px solid var(--border); border-radius: 4px; background: var(--raised);
}
button:hover { border-color: #8b789a; background: #302839; }
button.primary { color: #25151a; background: var(--spring); border-color: #fab199; font-weight: 720; }
button.primary:hover { background: #ffc4b0; }
:focus-visible { outline: 2px solid var(--spring); outline-offset: 2px; }
.app { max-width: 1390px; margin: 0 auto; padding: 32px clamp(16px, 3.4vw, 48px); }
.top, .brand, .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top { padding-bottom: 23px; margin-bottom: 21px; border-bottom: 1px solid var(--border); }
.brand { justify-content: flex-start; }
.brand p { color: var(--text); margin-top: 5px; }
.mark { display: grid; align-content: center; gap: 4px; width: 44px; height: 44px; padding: 8px; flex: none; border: 1px solid #885c6b; border-radius: 6px; background: #392535; }
.mark i { display: block; height: 3px; width: 22px; transform: skewX(-35deg); background: var(--spring); }
.mark i:nth-child(odd) { width: 14px; margin-left: 5px; background: var(--ease); }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, .47fr); gap: 15px; align-items: start; }
.main, aside { min-width: 0; display: grid; gap: 15px; }
.panel { min-width: 0; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface); }
.panel-top { min-height: 46px; padding: 8px 13px; border-bottom: 1px solid var(--border); }
.choices { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.choices button { min-height: 28px; padding: 3px 8px; font-size: 12px; }
.choices button[aria-pressed="true"] { color: var(--spring); background: #3a2934; border-color: #886170; }
.lanes {
  padding: 8px 15px;
  background-image: repeating-linear-gradient(90deg, #3b354b44 0 1px, transparent 1px 24px);
}
.lane { padding: 11px 0; min-width: 0; }
.lane + .lane { border-top: 1px solid var(--border); }
.lane p { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); }
.lane i { width: 7px; height: 7px; border-radius: 2px; }
.spring-dot { background: var(--spring); }
.ease-dot { background: var(--ease); }
.track { position: relative; height: 62px; overflow: hidden; }
.track::before { content: ""; position: absolute; height: 1px; background: #4a435c; top: 32px; left: 20px; right: 22px; }
.tile, .target { display: grid; place-items: center; position: absolute; top: 15px; left: 13px; width: 34px; height: 34px; border-radius: 5px; }
.target { border: 1px dashed #a297b7; background: #1e1b2a; }
.tile { border: 1px solid #ffdac6; background: var(--spring); box-shadow: 0 0 15px #ffb19930; will-change: transform; }
.tile::after { content: ""; display: block; width: 9px; height: 9px; border: 1px solid #633a49; transform: rotate(45deg); }
.tile.reference { border-color: #e0d8ff; background: var(--ease); box-shadow: 0 0 12px #c6b1ff24; }
.tile.reference::after { border-color: #483b79; }
.transport { display: flex; gap: 8px; align-items: center; padding: 10px 13px; border-top: 1px solid var(--border); }
.transport output { color: var(--text); font: 12px var(--mono); min-width: 66px; text-align: end; white-space: nowrap; }
input[type="range"] { width: 100%; min-width: 0; accent-color: var(--spring); cursor: pointer; }
.transport input { flex: 1; }
#progress { font: 12px var(--mono); color: var(--spring); }
#curve { width: 100%; height: 289px; display: block; touch-action: pan-y; cursor: crosshair; }
.control-body { padding: 11px 13px 14px; }
.presets { margin-bottom: 14px; }
.parameter { display: grid; grid-template-columns: 1fr minmax(32px, auto); align-items: center; gap: 4px 8px; margin: 11px 0; font-size: 13px; }
.parameter output { font: 12px var(--mono); color: var(--spring); text-align: end; padding: 2px 5px; border: 1px solid var(--border); border-radius: 3px; }
.parameter input { grid-column: 1 / -1; margin: 2px 0; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 12px; margin-top: 14px; border-top: 1px solid var(--border); }
.metrics .wide { grid-column: 1 / -1; }
.metrics dt { color: var(--text); font-size: 11px; }
.metrics dd { font: 600 16px/1.45 var(--mono); }
.metrics .wide dd { font-size: 12px; }
.export textarea {
  display: block; color: #e2d9f2; background: #12111b; border: 1px solid #332d42; border-radius: 4px;
  width: calc(100% - 24px); margin: 11px 12px; padding: 10px;
  min-height: 155px; resize: vertical; font: 11px/1.55 var(--mono);
}
#notice:not(:empty) { color: var(--text); font-size: 12px; padding: 0 12px 10px; }
@media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  .app { padding-top: 17px; }
  .top { align-items: flex-start; flex-direction: column; padding-bottom: 16px; margin-bottom: 15px; }
  .brand p { font-size: 12px; }
  .stage-top { flex-wrap: wrap; }
  #curve { height: 239px; }
  .transport { gap: 6px; padding-inline: 10px; }
  .transport button { padding-inline: 7px; }
}
</style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><h1>Spring Lab</h1><p>Tune a spring and take its motion into CSS.</p></div>
      </div>
      <button id="download" type="button">Download CSS</button>
    </header>
    <div class="workspace">
      <div class="main">
        <section class="panel stage" aria-labelledby="preview-heading">
          <div class="panel-top stage-top">
            <h2 id="preview-heading">Motion preview</h2>
            <div id="modes" class="choices" role="group" aria-label="Preview mode">
              <button type="button" data-mode="slide" aria-pressed="true">Slide</button>
              <button type="button" data-mode="pop" aria-pressed="false">Pop</button>
              <button type="button" data-mode="turn" aria-pressed="false">Turn</button>
            </div>
          </div>
          <div class="lanes" aria-label="Comparison of spring and cubic ease-out">
            <div class="lane">
              <p><i class="spring-dot"></i>Spring</p>
              <div class="track"><span class="target" aria-hidden="true"></span><span class="tile" id="spring-tile" aria-hidden="true"></span></div>
            </div>
            <div class="lane">
              <p><i class="ease-dot"></i>Cubic ease-out</p>
              <div class="track"><span class="target" aria-hidden="true"></span><span class="tile reference" id="reference-tile" aria-hidden="true"></span></div>
            </div>
          </div>
          <div class="transport">
            <button id="play" class="primary" type="button">Play</button>
            <button id="restart" type="button">Reset</button>
            <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub animation">
            <output id="clock" for="scrub"></output>
          </div>
        </section>
        <section class="panel graph-panel" aria-labelledby="graph-heading">
          <div class="panel-top"><h2 id="graph-heading">Progress over time</h2><span id="progress"></span></div>
          <canvas id="curve" role="img" aria-label="Chart comparing the spring easing curve with cubic ease-out"></canvas>
        </section>
      </div>
      <aside>
        <section class="panel controls" aria-labelledby="controls-heading">
          <div class="panel-top"><h2 id="controls-heading">Spring settings</h2></div>
          <div class="control-body">
            <div id="presets" class="choices presets" role="group" aria-label="Spring presets">
              <button data-preset="snappy" type="button" aria-pressed="false">Snappy</button>
              <button data-preset="bounce" type="button" aria-pressed="false">Bouncy</button>
              <button data-preset="soft" type="button" aria-pressed="false">Soft</button>
            </div>
            <label class="parameter" for="stiffness">
              <span>Stiffness</span><output id="stiffness-value" for="stiffness"></output>
              <input id="stiffness" type="range" min="80" max="600" step="1">
            </label>
            <label class="parameter" for="damping">
              <span>Damping</span><output id="damping-value" for="damping"></output>
              <input id="damping" type="range" min="6" max="60" step="1">
            </label>
            <label class="parameter" for="mass">
              <span>Mass</span><output id="mass-value" for="mass"></output>
              <input id="mass" type="range" min="0.6" max="2.2" step="0.1">
            </label>
            <dl class="metrics">
              <div><dt>Settling time</dt><dd id="duration"></dd></div>
              <div><dt>Overshoot</dt><dd id="overshoot"></dd></div>
              <div class="wide"><dt>Damping regime</dt><dd id="regime"></dd></div>
            </dl>
          </div>
        </section>
        <section class="panel export" aria-labelledby="export-heading">
          <div class="panel-top"><h2 id="export-heading">CSS export</h2><button id="copy" type="button">Copy CSS</button></div>
          <textarea id="css" readonly spellcheck="false" aria-label="Generated CSS"></textarea>
          <p id="notice" role="status" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </main>
  <script>const reference = progress => 1 - (1 - progress) ** 3

function oscillator({ stiffness, damping, mass }) {
  if (![stiffness, damping, mass].every(value => Number.isFinite(value) && value > 0)) {
    throw new RangeError('Stiffness, damping and mass must be positive numbers.')
  }
  const alpha = damping / (2 * mass)
  const omegaSquared = stiffness / mass
  const discriminant = alpha ** 2 - omegaSquared
  const ratio = alpha / Math.sqrt(omegaSquared)
  const rest = time => Math.exp(-alpha * time)

  if (Math.abs(discriminant) < omegaSquared * 1e-9) {
    return {
      ratio,
      regime: 'Critical',
      overshoot: 0,
      at(time) {
        const decay = rest(time)
        return { position: 1 - decay * (1 + alpha * time), speed: decay * alpha ** 2 * time }
      },
    }
  }

  if (discriminant < 0) {
    const beta = Math.sqrt(-discriminant)
    return {
      ratio,
      regime: 'Underdamped',
      overshoot: Math.exp(-Math.PI * alpha / beta),
      at(time) {
        const decay = rest(time)
        const sine = Math.sin(beta * time)
        return {
          position: 1 - decay * (Math.cos(beta * time) + alpha / beta * sine),
          speed: decay * omegaSquared / beta * sine,
        }
      },
    }
  }

  const fast = -alpha - Math.sqrt(discriminant)
  const slow = omegaSquared / fast
  return {
    ratio,
    regime: 'Overdamped',
    overshoot: 0,
    at(time) {
      const slowPart = Math.exp(slow * time)
      const fastPart = Math.exp(fast * time)
      return {
        position: 1 - (slow * fastPart - fast * slowPart) / (slow - fast),
        speed: slow * fast * (slowPart - fastPart) / (slow - fast),
      }
    },
  }
}

function simplify(values, tolerance) {
  const last = values.length - 1
  const selected = new Set([0, last])
  const segments = [[0, last]]
  while (segments.length) {
    const [left, right] = segments.pop()
    const slope = (values[right] - values[left]) / (right - left)
    let furthest = -1
    let error = tolerance
    for (let index = left + 1; index < right; index++) {
      const between = values[left] + (index - left) * slope
      const distance = Math.abs(values[index] - between)
      if (distance > error) {
        furthest = index
        error = distance
      }
    }
    if (furthest !== -1) {
      selected.add(furthest)
      segments.push([left, furthest], [furthest, right])
    }
  }
  return [...selected].sort((first, second) => first - second)
}

function buildSpring(settings) {
  const model = oscillator(settings)
  const stepMs = 4
  const horizonMs = 8000
  const samples = []
  let lastMoving = 0
  for (let time = 0; time <= horizonMs; time += stepMs) {
    const { position, speed } = model.at(time / 1000)
    if (Math.abs(position - 1) > 0.0025 || Math.abs(speed) > 0.025) {
      lastMoving = samples.length
    }
    samples.push(position)
  }
  const settled = lastMoving < samples.length - 1
  const end = Math.min(samples.length - 1, Math.max(50, lastMoving + 1))
  const values = samples.slice(0, end + 1)
  values[0] = 0
  values[end] = 1
  const points = simplify(values, 0.002).map(index => ({
    percent: Number((100 * index / end).toFixed(3)),
    position: Number(values[index].toFixed(5)),
  }))
  return {
    durationMs: end * stepMs,
    points,
    ratio: model.ratio,
    regime: model.regime,
    overshoot: model.overshoot,
    settled,
  }
}

function sampleEasing(points, progress) {
  const percent = Math.min(100, Math.max(0, progress * 100))
  for (let index = 1; index < points.length; index++) {
    const before = points[index - 1]
    const after = points[index]
    if (percent <= after.percent) {
      const span = after.percent - before.percent
      return before.position + (after.position - before.position) * (percent - before.percent) / span
    }
  }
  return points.at(-1).position
}

function easingCSS(points) {
  const stops = points.map(({ position, percent }) => position + ' ' + percent + '%')
  const lines = []
  for (let index = 0; index < stops.length; index += 4) {
    lines.push('    ' + stops.slice(index, index + 4).join(', '))
  }
  return 'linear(\n' + lines.join(',\n') + '\n  )'
}


const get = id => document.getElementById(id)
const presets = {
  snappy: { stiffness: 330, damping: 30, mass: 1 },
  bounce: { stiffness: 180, damping: 12, mass: 1 },
  soft: { stiffness: 100, damping: 22, mass: 1.4 },
}
const modes = {
  slide: { from: 'translateX(0px)', to: 'translateX(160px)' },
  pop: { from: 'scale(.55)', to: 'scale(1)' },
  turn: { from: 'rotate(-90deg)', to: 'rotate(0deg)' },
}
const tracks = [get('spring-tile'), get('reference-tile')]
const canvas = get('curve')
const ctx = canvas.getContext('2d')
const parameters = Object.keys(presets.bounce)
let spring
let preset = 'bounce'
let mode = 'slide'
let progress = 0
let frame = null

function updateExport() {
  const values = [
    ':root {',
    '  --spring-duration: ' + spring.durationMs + 'ms;',
    '  --spring-ease: ' + easingCSS(spring.points) + ';',
    '}',
    '',
    '.spring-target {',
    '  transform: ' + modes[mode].from + ';',
    '  transition: transform var(--spring-duration) var(--spring-ease);',
    '}',
    '',
    '.spring-target.is-active { transform: ' + modes[mode].to + '; }',
    '',
    '@media (prefers-reduced-motion: reduce) {',
    '  .spring-target { transition: none; }',
    '}',
  ]
  get('css').value = values.join('\n') + '\n'
  get('notice').textContent = spring.settled ? '' : 'Motion is capped at 8 seconds.'
}

function positionTile(tile, value) {
  const lane = tile.parentElement
  const room = Math.max(0, lane.clientWidth - 60)
  const travel = room / Math.max(1.1, 1.06 + spring.overshoot)
  const center = room / 2
  const destination = mode === 'slide' ? travel : center
  lane.querySelector('.target').style.transform = 'translateX(' + destination + 'px)'
  if (mode === 'slide') {
    tile.style.transform = 'translateX(' + travel * value + 'px)'
  } else if (mode === 'pop') {
    tile.style.transform = 'translateX(' + center + 'px) scale(' + (0.55 + value * 0.45) + ')'
  } else {
    tile.style.transform = 'translateX(' + center + 'px) rotate(' + (-90 + 90 * value) + 'deg)'
  }
}

function chartBounds() {
  return { x: 45, y: 15, width: Math.max(1, canvas.clientWidth - 67), height: Math.max(1, canvas.clientHeight - 48) }
}

function drawCurve(position) {
  if (!ctx) return
  const width = canvas.clientWidth
  const height = canvas.clientHeight
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
    canvas.width = Math.round(width * dpr)
    canvas.height = Math.round(height * dpr)
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, width, height)
  const bounds = chartBounds()
  const ceiling = Math.max(1.15, 1.08 + spring.overshoot)
  const x = value => bounds.x + value * bounds.width
  const y = value => bounds.y + (ceiling - value) / (ceiling + 0.04) * bounds.height
  ctx.font = '11px ui-monospace, monospace'
  ctx.lineWidth = 1
  ctx.textBaseline = 'middle'
  ctx.fillStyle = '#bcb4ca'
  for (const value of [0, 0.5, 1]) {
    ctx.strokeStyle = value === 1 ? '#766984' : '#362f45'
    ctx.beginPath()
    ctx.moveTo(x(0), y(value))
    ctx.lineTo(x(1), y(value))
    ctx.stroke()
    ctx.textAlign = 'right'
    ctx.fillText(100 * value + '%', x(0) - 7, y(value))
  }
  for (let index = 0; index <= 4; index++) {
    const step = index / 4
    ctx.strokeStyle = '#362f45'
    ctx.beginPath()
    ctx.moveTo(x(step), bounds.y)
    ctx.lineTo(x(step), bounds.y + bounds.height)
    ctx.stroke()
    ctx.textAlign = index === 0 ? 'left' : index === 4 ? 'right' : 'center'
    ctx.fillText(Math.round(step * spring.durationMs) + ' ms', x(step), bounds.y + bounds.height + 14)
  }

  ctx.strokeStyle = '#bcb0f7'
  ctx.lineWidth = 1.5
  ctx.setLineDash([5, 5])
  ctx.beginPath()
  for (let index = 0; index <= 64; index++) {
    const step = index / 64
    if (!index) ctx.moveTo(x(step), y(reference(step)))
    else ctx.lineTo(x(step), y(reference(step)))
  }
  ctx.stroke()
  ctx.setLineDash([])
  ctx.beginPath()
  ctx.lineWidth = 2.5
  ctx.strokeStyle = '#ffb199'
  for (const [index, point] of spring.points.entries()) {
    const pointX = x(point.percent / 100)
    const pointY = y(point.position)
    if (!index) ctx.moveTo(pointX, pointY)
    else ctx.lineTo(pointX, pointY)
  }
  ctx.stroke()
  ctx.strokeStyle = '#a19aa8'
  ctx.lineWidth = 1
  ctx.beginPath()
  ctx.moveTo(x(progress), bounds.y)
  ctx.lineTo(x(progress), bounds.y + bounds.height)
  ctx.stroke()
  ctx.fillStyle = '#ffddd1'
  ctx.beginPath()
  ctx.arc(x(progress), y(position), 4, 0, 2 * Math.PI)
  ctx.fill()
}

function seek(value) {
  progress = Math.min(1, Math.max(0, value))
  const position = sampleEasing(spring.points, progress)
  get('scrub').value = Math.round(1000 * progress)
  get('clock').value = Math.round(spring.durationMs * progress) + ' ms'
  get('progress').textContent = (100 * position).toFixed(1) + '% spring'
  positionTile(tracks[0], position)
  positionTile(tracks[1], reference(progress))
  drawCurve(position)
}

function stop() {
  if (frame !== null) cancelAnimationFrame(frame)
  frame = null
  get('play').textContent = 'Play'
}

function play() {
  if (frame !== null) return stop()
  if (progress >= 1) seek(0)
  get('play').textContent = 'Pause'
  const start = performance.now() - progress * spring.durationMs
  const tick = time => {
    seek((time - start) / spring.durationMs)
    if (progress < 1) frame = requestAnimationFrame(tick)
    else stop()
  }
  frame = requestAnimationFrame(tick)
}

function rebuild() {
  stop()
  const settings = Object.fromEntries(parameters.map(name => {
    const value = Number(get(name).value)
    get(name + '-value').value = value
    return [name, value]
  }))
  for (const button of get('presets').querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button.dataset.preset === preset))
  }
  spring = buildSpring(settings)
  get('duration').textContent = spring.durationMs + ' ms' + (spring.settled ? '' : ' cap')
  get('overshoot').textContent = (100 * spring.overshoot).toFixed(1) + '%'
  get('regime').textContent = spring.regime + ' · ζ ' + spring.ratio.toFixed(2)
  updateExport()
  seek(0)
}

function applyPreset(name) {
  preset = name
  for (const [parameter, value] of Object.entries(presets[name])) get(parameter).value = value
  rebuild()
}

for (const parameter of parameters) {
  get(parameter).addEventListener('input', () => { preset = null; rebuild() })
}
get('presets').addEventListener('click', event => {
  const button = event.target.closest('[data-preset]')
  if (button) applyPreset(button.dataset.preset)
})
get('modes').addEventListener('click', event => {
  const button = event.target.closest('[data-mode]')
  if (!button) return
  mode = button.dataset.mode
  for (const item of get('modes').querySelectorAll('button')) item.setAttribute('aria-pressed', String(item === button))
  updateExport()
  seek(progress)
})
get('play').addEventListener('click', play)
get('restart').addEventListener('click', () => { stop(); seek(0) })
get('scrub').addEventListener('input', event => { stop(); seek(Number(event.target.value) / 1000) })

function seekFromPointer(event) {
  const bounds = chartBounds()
  seek((event.clientX - canvas.getBoundingClientRect().left - bounds.x) / bounds.width)
}
canvas.addEventListener('pointerdown', event => {
  if (event.button !== 0) return
  stop()
  canvas.setPointerCapture(event.pointerId)
  seekFromPointer(event)
})
canvas.addEventListener('pointermove', event => {
  if (canvas.hasPointerCapture(event.pointerId)) seekFromPointer(event)
})

get('copy').addEventListener('click', async () => {
  const field = get('css')
  try {
    await navigator.clipboard.writeText(field.value)
    get('notice').textContent = 'CSS copied.'
  } catch {
    field.focus()
    field.select()
    get('notice').textContent = 'CSS selected. Use your browser’s copy shortcut or Download CSS.'
  }
})
get('download').addEventListener('click', () => {
  const blob = new Blob([get('css').value], { type: 'text/css' })
  const url = URL.createObjectURL(blob)
  const link = document.createElement('a')
  link.href = url
  link.download = 'spring-motion.css'
  document.body.append(link)
  link.click()
  link.remove()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
})
applyPreset('bounce')
new ResizeObserver(() => seek(progress)).observe(canvas)
</script>
